<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Prototype: Folder-Based Notes with Images</title>
  <style>
    :root{--bg:#0f1724;--panel:#0b1220;--muted:#9aa6b2;--accent:#2dd4bf;--card:#111827}
    *{box-sizing:border-box;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial}
    html,body{height:100%;margin:0;background:linear-gradient(180deg,#071022 0%, #081426 100%);color:#e6eef6}
    .app{display:grid;grid-template-columns:260px 1fr 420px;gap:18px;height:100vh;padding:18px}
    .card{background:rgba(255,255,255,0.03);border-radius:12px;padding:14px;box-shadow:0 6px 18px rgba(2,6,23,0.6)}
    /* Sidebar */
    .sidebar{display:flex;flex-direction:column;height:100%}
    .brand{font-weight:700;font-size:16px;margin-bottom:10px}
    .folders{flex:1;overflow:auto;padding-right:6px}
    .folder-item{padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:6px}
    .folder-item.active{background:rgba(45,212,191,0.08);outline:1px solid rgba(45,212,191,0.06)}
    .folder-actions{display:flex;gap:6px;margin-top:10px}
    .btn{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:8px 10px;border-radius:8px;color:var(--muted);cursor:pointer}
    .btn.primary{background:var(--accent);color:#042022;border:none}
    /* Middle */
    .middle{display:flex;flex-direction:column;height:100%}
    .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .search{flex:1;margin-right:12px}
    input[type=text], textarea, select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit}
    .notes-list{flex:1;overflow:auto}
    .note-card{display:flex;gap:12px;align-items:center;padding:10px;border-radius:10px;margin-bottom:8px;cursor:pointer}
    .note-card:hover{background:rgba(255,255,255,0.02)}
    .note-thumb{width:64px;height:48px;border-radius:8px;object-fit:cover;background:#0b1220;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
    .note-meta{flex:1}
    .note-title{font-weight:600}
    .note-sub{font-size:12px;color:var(--muted)}
    /* Right panel */
    .detail{height:100%;display:flex;flex-direction:column}
    .detail .content{overflow:auto;padding-top:6px}
    .detail img{max-width:100%;border-radius:10px;margin-top:8px}
    .field{margin-bottom:8px}
    .small{font-size:13px;color:var(--muted)}
    /* modal */
    .modal{position:fixed;inset:0;display:none;background:linear-gradient(rgba(2,6,23,0.6), rgba(2,6,23,0.6));align-items:center;justify-content:center}
    .modal.open{display:flex}
    .modal-card{width:720px;max-width:95%;background:var(--panel);padding:16px;border-radius:12px}
    .row{display:flex;gap:10px}
    .col{flex:1}
    .muted{color:var(--muted)}
    footer{font-size:12px;color:var(--muted);padding:8px 18px;text-align:right}
    @media (max-width:1000px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr 420px;height:100vh}.detail{order:3}.middle{order:2}.sidebar{order:1;height:240px}}
  </style>
</head>
<body>
  <div class="app">
    <div class="card sidebar">
      <div class="brand">Folder Notes • Prototype</div>
      <div style="margin-bottom:8px">Pilih folder untuk lihat ide</div>
      <div class="folders" id="folderList"></div>
      <div class="folder-actions">
        <button class="btn" id="btnNewFolder">+ Folder</button>
        <button class="btn" id="btnRenameFolder">Rename</button>
        <button class="btn" id="btnDelFolder">Hapus</button>
      </div>
    </div>

    <div class="card middle">
      <div class="toolbar">
        <div style="display:flex;gap:8px;flex:1;align-items:center">
          <input id="search" type="text" placeholder="Cari judul ide..." />
          <select id="folderSelector" style="width:260px"></select>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn" id="btnExport">Export</button>
          <button class="btn primary" id="btnAddNote">+ Ide Baru</button>
        </div>
      </div>

      <div class="notes-list" id="notesList"></div>
    </div>

    <div class="card detail">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div>
          <div class="small">Detail Ide</div>
          <div id="detailTitle" style="font-weight:700;font-size:16px">Pilih ide dari list</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <select id="changeFolder"></select>
          <button class="btn" id="btnEditNote">Edit</button>
          <button class="btn" id="btnDeleteNote">Hapus</button>
        </div>
      </div>

      <div class="content">
        <div class="field"><div class="small">Deskripsi</div><div id="detailDesc" style="margin-top:6px">-</div></div>
        <div class="field"><div class="small">Bagian Penting</div><div id="detailPoints" style="margin-top:6px">-</div></div>
        <div class="field"><div class="small">Rencana Pengembangan</div><div id="detailPlan" style="margin-top:6px">-</div></div>
        <div class="field"><div class="small">Gambar</div><div id="detailImage" style="margin-top:6px"></div></div>
      </div>
    </div>
  </div>

  <!-- Modal: Add/Edit Note -->
  <div class="modal" id="modal">
    <div class="modal-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="font-weight:700">Tambah / Edit Ide</div>
        <button class="btn" id="modalClose">Tutup</button>
      </div>
      <div class="row">
        <div class="col">
          <div class="field"><label class="small">Judul</label><input id="noteTitle" type="text" /></div>
          <div class="field"><label class="small">Deskripsi</label><textarea id="noteDesc" rows="6"></textarea></div>
          <div class="field"><label class="small">Bagian Penting (singkat)</label><input id="notePoints" type="text" /></div>
          <div class="field"><label class="small">Rencana Pengembangan</label><input id="notePlan" type="text" /></div>
          <div class="field"><label class="small">Pilih Folder</label><select id="noteFolder"></select></div>
        </div>
        <div class="col">
          <div class="field"><label class="small">Gambar (upload)</label><input id="noteImage" type="file" accept="image/*" /></div>
          <div class="field"><div class="small">Preview</div><div id="imgPreview" style="margin-top:8px"></div></div>
          <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="btnSaveNote">Simpan</button></div>
        </div>
      </div>
    </div>
  </div>

  <footer>Prototype: simpan disimpan ke browser (localStorage). Gunakan Export untuk backup.</footer>

  <script>
    // ======= Data helpers =======
    const LS_FOLDERS = 'fb_folders_v1'
    const LS_NOTES = 'fb_notes_v1'

    // Default sample folders
    function defaultFolders(){
      return [
        {id:'root', name:'IDE UTAMA', parent:null},
        {id:'desain', name:'Desain', parent:'root'},
        {id:'desain_logo', name:'Logo', parent:'desain'},
        {id:'desain_ui', name:'UI/UX', parent:'desain'},
        {id:'pendidikan', name:'Pendidikan', parent:'root'},
        {id:'tech', name:'Teknologi', parent:'root'},
        {id:'random', name:'Random', parent:'root'}
      ]
    }

    function loadFolders(){
      const raw = localStorage.getItem(LS_FOLDERS)
      return raw ? JSON.parse(raw) : defaultFolders()
    }
    function saveFolders(f){ localStorage.setItem(LS_FOLDERS, JSON.stringify(f)) }

    function loadNotes(){
      const raw = localStorage.getItem(LS_NOTES)
      return raw ? JSON.parse(raw) : []
    }
    function saveNotes(n){ localStorage.setItem(LS_NOTES, JSON.stringify(n)) }

    function uid(prefix='id'){return prefix+'_'+Math.random().toString(36).slice(2,9)}

    // ======= UI state =======
    let folders = loadFolders()
    let notes = loadNotes()
    let activeFolder = 'root'
    let activeNoteId = null

    // ======= Renderers =======
    function buildFolderTreeOptions(){
      // returns array of option elements for selectors
      const map = {}
      folders.forEach(f=>map[f.id]= {...f, children:[]})
      Object.values(map).forEach(f=>{ if(f.parent&&map[f.parent]) map[f.parent].children.push(f) })
      const root = map['root']
      const opts = []
      function walk(node, prefix=''){
        const label = prefix ? prefix + ' / ' + node.name : node.name
        opts.push({id:node.id, label})
        node.children.sort((a,b)=>a.name.localeCompare(b.name)).forEach(ch=>walk(ch, label))
      }
      walk(root,'')
      return opts
    }

    function renderFolderList(){
      const container = document.getElementById('folderList')
      container.innerHTML=''
      // show as simple list (tree-like)
      const opts = buildFolderTreeOptions()
      opts.forEach(o=>{
        const el = document.createElement('div')
        el.className='folder-item'+(o.id===activeFolder? ' active':'')
        el.textContent = o.label
        el.onclick = ()=>{ activeFolder=o.id; renderAll() }
        container.appendChild(el)
      })
    }

    function renderFolderSelectors(){
      const selectors = ['folderSelector','noteFolder','changeFolder']
      const opts = buildFolderTreeOptions()
      selectors.forEach(id=>{
        const el = document.getElementById(id)
        el.innerHTML = ''
        opts.forEach(o=>{
          const opt = document.createElement('option')
          opt.value = o.id
          opt.textContent = o.label
          el.appendChild(opt)
        })
      })
      // keep selected values
      document.getElementById('folderSelector').value = activeFolder
      document.getElementById('noteFolder').value = activeFolder
      document.getElementById('changeFolder').value = activeFolder
    }

    function renderNotesList(){
      const container = document.getElementById('notesList')
      container.innerHTML=''
      const q = document.getElementById('search').value.trim().toLowerCase()
      const filtered = notes.filter(n=>n.folder===activeFolder && (!q || n.title.toLowerCase().includes(q)))
      if(filtered.length===0){ container.innerHTML='<div class="muted">Belum ada ide pada folder ini.</div>'; return }
      filtered.sort((a,b)=>new Date(b.updated||b.created) - new Date(a.updated||a.created))
      filtered.forEach(n=>{
        const card = document.createElement('div')
        card.className='note-card'
        card.onclick = ()=>{ activeNoteId = n.id; renderDetail() }
        const thumb = document.createElement('div')
        thumb.className='note-thumb'
        if(n.image){ const img = document.createElement('img'); img.src=n.image; img.style.width='100%'; img.style.height='100%'; img.style.objectFit='cover'; img.style.borderRadius='8px'; thumb.appendChild(img)} else { thumb.textContent = 'No Image' }
        const meta = document.createElement('div'); meta.className='note-meta'
        const title = document.createElement('div'); title.className='note-title'; title.textContent=n.title
        const sub = document.createElement('div'); sub.className='note-sub'; sub.textContent = (n.points || '') + ' • ' + new Date(n.updated||n.created).toLocaleString()
        meta.appendChild(title); meta.appendChild(sub)
        card.appendChild(thumb); card.appendChild(meta)
        container.appendChild(card)
      })
    }

    function renderDetail(){
      const tEl = document.getElementById('detailTitle')
      const dEl = document.getElementById('detailDesc')
      const pEl = document.getElementById('detailPoints')
      const plEl = document.getElementById('detailPlan')
      const imgEl = document.getElementById('detailImage')
      if(!activeNoteId){ tEl.textContent='Pilih ide dari list'; dEl.textContent='-'; pEl.textContent='-'; plEl.textContent='-'; imgEl.innerHTML=''; return }
      const n = notes.find(x=>x.id===activeNoteId)
      if(!n) return
      tEl.textContent = n.title
      dEl.textContent = n.desc || '-'
      pEl.textContent = n.points || '-'
      plEl.textContent = n.plan || '-'
      imgEl.innerHTML=''
      if(n.image){ const img = document.createElement('img'); img.src = n.image; img.alt='preview'; imgEl.appendChild(img) }
      document.getElementById('changeFolder').value = n.folder
    }

    function renderAll(){ renderFolderList(); renderFolderSelectors(); renderNotesList(); renderDetail() }

    // ======= Actions =======
    document.getElementById('btnAddNote').addEventListener('click', ()=>openModal())
    document.getElementById('btnSaveNote').addEventListener('click', saveNote)
    document.getElementById('modalClose').addEventListener('click', closeModal)
    document.getElementById('search').addEventListener('input', renderNotesList)
    document.getElementById('folderSelector').addEventListener('change', (e)=>{ activeFolder=e.target.value; renderAll() })
    document.getElementById('btnExport').addEventListener('click', ()=>{
      const data = {folders,notes}
      const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'})
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a'); a.href=url; a.download='folder-notes-export.json'; a.click(); URL.revokeObjectURL(url)
    })

    document.getElementById('changeFolder').addEventListener('change', (e)=>{
      const id = activeNoteId
      if(!id) return
      const n = notes.find(x=>x.id===id)
      if(n){ n.folder = e.target.value; n.updated = new Date().toISOString(); saveNotes(notes); renderAll() }
    })

    document.getElementById('btnDeleteNote').addEventListener('click', ()=>{
      if(!activeNoteId) return alert('Pilih ide dulu')
      if(!confirm('Hapus ide ini?')) return
      notes = notes.filter(x=>x.id!==activeNoteId); saveNotes(notes); activeNoteId=null; renderAll()
    })

    document.getElementById('btnEditNote').addEventListener('click', ()=>{
      if(!activeNoteId) return alert('Pilih ide dulu')
      openModal(activeNoteId)
    })

    // Folder actions
    document.getElementById('btnNewFolder').addEventListener('click', ()=>{
      const name = prompt('Nama folder baru (contoh: Desain/Logo => masukkan nama folder, lalu pilih parent)')
      if(!name) return
      const parent = document.querySelector('#noteFolder')?.value || 'root'
      const id = uid('f')
      folders.push({id, name, parent})
      saveFolders(folders); renderAll()
    })
    document.getElementById('btnRenameFolder').addEventListener('click', ()=>{
      const sel = document.querySelector('#noteFolder')
      const id = sel.value
      const f = folders.find(x=>x.id===id)
      if(!f) return
      const name = prompt('Nama baru untuk folder', f.name)
      if(!name) return
      f.name = name; saveFolders(folders); renderAll()
    })
    document.getElementById('btnDelFolder').addEventListener('click', ()=>{
      const id = document.querySelector('#noteFolder').value
      if(id==='root') return alert('Folder root tidak bisa dihapus')
      if(!confirm('Hapus folder ini dan pindahkan isinya ke root?')) return
      // move children & notes to root
      folders.forEach(f=>{ if(f.parent===id) f.parent='root' })
      notes.forEach(n=>{ if(n.folder===id) n.folder='root' })
      folders = folders.filter(f=>f.id!==id)
      saveFolders(folders); saveNotes(notes); renderAll()
    })

    // Modal logic
    function openModal(editId=null){
      document.getElementById('modal').classList.add('open')
      document.getElementById('noteTitle').value=''
      document.getElementById('noteDesc').value=''
      document.getElementById('notePoints').value=''
      document.getElementById('notePlan').value=''
      document.getElementById('imgPreview').innerHTML=''
      document.getElementById('noteImage').value=''
      document.getElementById('noteFolder').value = activeFolder
      document.getElementById('btnSaveNote').dataset.editId = ''
      if(editId){
        const n = notes.find(x=>x.id===editId)
        if(n){ document.getElementById('noteTitle').value = n.title || '';
                 document.getElementById('noteDesc').value = n.desc || '';
                 document.getElementById('notePoints').value = n.points || '';
                 document.getElementById('notePlan').value = n.plan || '';
                 document.getElementById('noteFolder').value = n.folder || activeFolder;
                 if(n.image){ const img=document.createElement('img'); img.src=n.image; img.style.maxWidth='100%'; img.style.borderRadius='8px'; document.getElementById('imgPreview').appendChild(img) }
                 document.getElementById('btnSaveNote').dataset.editId = editId
        }
      }
    }
    function closeModal(){ document.getElementById('modal').classList.remove('open') }

    // Image upload preview
    document.getElementById('noteImage').addEventListener('change', function(e){
      const f = e.target.files[0]
      if(!f) return
      const reader = new FileReader()
      reader.onload = ()=>{
        const src = reader.result
        document.getElementById('imgPreview').innerHTML = ''
        const img = document.createElement('img'); img.src = src; img.style.maxWidth='100%'; img.style.borderRadius='8px'; document.getElementById('imgPreview').appendChild(img)
        document.getElementById('btnSaveNote').dataset.image = src
      }
      reader.readAsDataURL(f)
    })

    function saveNote(){
      const editId = document.getElementById('btnSaveNote').dataset.editId
      const title = document.getElementById('noteTitle').value.trim()
      if(!title) return alert('Judul dibutuhkan')
      const desc = document.getElementById('noteDesc').value.trim()
      const points = document.getElementById('notePoints').value.trim()
      const plan = document.getElementById('notePlan').value.trim()
      const folder = document.getElementById('noteFolder').value
      const image = document.getElementById('btnSaveNote').dataset.image || null
      if(editId){
        const n = notes.find(x=>x.id===editId)
        if(!n) return
        n.title=title; n.desc=desc; n.points=points; n.plan=plan; n.folder=folder; if(image) n.image=image; n.updated = new Date().toISOString();
      } else {
        const n = { id: uid('note'), title, desc, points, plan, folder, image, created: new Date().toISOString() }
        notes.push(n)
        activeNoteId = n.id
      }
      // cleanup temp image
      delete document.getElementById('btnSaveNote').dataset.image
      saveNotes(notes); closeModal(); renderAll()
    }

    // Init
    renderAll()

    // If you want to allow importing, attach a simple input dynamically
    // (not shown in UI to keep prototype minimal)
  </script>
</body>
</html>
